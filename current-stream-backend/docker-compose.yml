services:
  mysql:
    image: mysql:8.0
    container_name: currentstream-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: currentstream
      MYSQL_USER: ${DB_USERNAME:-cs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cs_pass_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: .
    container_name: currentstream-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/currentstream?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${DB_USERNAME:-cs_user}
      DB_PASSWORD: ${DB_PASSWORD:-cs_pass_change_me}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase/serviceAccountKey.json
    volumes:
      - ./secrets/firebase:/run/secrets/firebase:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
