# DB EC2 전용 — MySQL만 실행
# 사용: cp .env.example .env 후 docker compose up -d
# Backend EC2에서는 docker-compose.backend.yml 사용

services:
  mysql:
    image: mysql:8.0
    container_name: currentstream-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-currentstream}
      MYSQL_USER: ${DB_USERNAME:-cs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cs_pass_change_me}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
