spring:
  application:
    name: current-stream-backend
  jackson:
    time-zone: Asia/Seoul
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/currentstream?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:cs_user}
    password: ${DB_PASSWORD:dik12345}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
